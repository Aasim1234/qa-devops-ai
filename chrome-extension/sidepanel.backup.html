<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>QA DevOps AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h2>QA DevOps AI</h2>
    <span id="status">Checking...</span>
  </div>

  <textarea id="question" placeholder="Ask a QA or DevOps question..."></textarea>

  <div class="buttons">
    <button id="speakBtn">🎤 Speak</button>
    <button id="askBtn">Ask</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="answerBox" class="answer">
    <div class="label">AI Answer</div>
    <div id="answer">Ready.</div>
  </div>

  <button id="readBtn" class="read">🔊 Read Answer</button>

  <script src="sidepanel.js"></script>
</body>
</html>
