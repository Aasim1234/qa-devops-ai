<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QA DevOps AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>QA DevOps AI</h2>

    <textarea
        id="question"
        placeholder="Ask a DevOps question..."
    ></textarea>

    <div class="buttons">

        <button id="voiceBtn">
            🎤 Speak
        </button>

        <button id="askBtn">
            Ask
        </button>

    </div>

    <div id="status"></div>

    <div id="answer"></div>

    <button id="speakBtn">
        🔊 Read Answer
    </button>

</div>

<script src="popup.js"></script>

</body>
</html>
